# Rotate the demo browser key.
#
# **Why this exists.** `portal/wrangler.jsonc` carried `DEMO_BROWSER_API_KEY` as a plain `vars`
# value, so a live production-bound credential was committed to the repository — and, being in
# history, could never be removed from it.
#
# The credential is a browser key: public by design, origin-allowlisted and daily-capped. The
# problem was never disclosure. It was that the file became an append-only log of live credentials,
# and that every future rotation wrote the next one into the tree as well. Moving the value into
# the Cloudflare secret store means the repository carries only the *name* of the secret, and a
# rotation leaves no trace in the tree at all.
#
# The procedure is written down in `docs/ops/demo-browser-key-rotation.md`. This workflow is the
# same procedure, using the credential the deploy job already holds, so it does not need a human's
# local machine and a wrangler login.
#
# **How it gets at the key store.** The deploy job's token cannot read or write Workers KV — that
# is a separate Cloudflare permission and it does not have it. It does not need to: the Worker
# itself holds the `API_KEYS` binding, and `POST /admin/projection/keys` and
# `DELETE /admin/projection/keys/:id` are the application's own supported ops interface for minting
# and revoking keys. So the minting and the revocation go *through the Worker*, and the token only
# has to deploy.
#
# The route is guarded by `PROJECTION_ADMIN_SECRET`, which is **not set in production** — the
# portal projects in-process and the route exists for external ops tooling. So each run turns the
# route on, uses it, and turns it off again: the route is enabled only while a run is in flight.
#
# **Two actions, because the order matters.**
#
# - `mint` — mint a replacement carrying the old key's own customer, origins, cap and label, put it
#   in the secret store, and report whether the Worker is now serving it. Does not revoke.
# - `revoke` — disable a key by id, so the value that is in git history stops working. Run this
#   **after** the `vars` entry has been removed and deployed, or the try-it widget loses its key.
#
# The new key is never printed. It lives in the secret store and on the page the browser reads it
# from, which is where a public browser key belongs.
name: Rotate the demo browser key

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'mint — create a replacement and put it in the secret store. revoke — disable a key. check — report what this credential can do.'
        required: true
        type: choice
        options:
          - mint
          - revoke
          - check
        default: mint
      key:
        description: 'For `revoke`: the key id to disable, e.g. pk_live_…'
        required: false
      old_key:
        description: 'For `mint`: the key being replaced. Defaults to the one in portal/wrangler.jsonc.'
        required: false

permissions:
  contents: read

concurrency:
  group: rotate-demo-browser-key
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ad5ec479b9a421faa2ed06c3d1c2b23a
  # The deployable config is generated by the portal's build; `scripts/write-deploy-redirect.mjs`
  # points wrangler at it. The secret must go on the same Worker the deploy job ships.
  WORKER_CONFIG: portal/build/server/wrangler.json
  PORTAL_CONFIG: portal/wrangler.jsonc
  API_BASE: https://cancoder.chesterhillsolutions.ca

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the deployable config
        run: bun run build

      # ---------------------------------------------------------------------------------------------
      # Turn the projection route on, use it, turn it off.
      #
      # `PROJECTION_ADMIN_SECRET` is not set in production, so this is a route that exists and is
      # closed. It is opened only for the duration of a run, with a value that is generated here and
      # never printed.
      # ---------------------------------------------------------------------------------------------
      - name: Mint a replacement
        if: inputs.action == 'mint'
        env:
          OLD_KEY: ${{ inputs.old_key }}
        run: |
          set -euo pipefail

          # The key being replaced: the one in the config, unless the caller named another.
          if [ -z "${OLD_KEY:-}" ]; then
            OLD_KEY=$(grep -oE 'pk_live_[a-f0-9]+' portal/wrangler.jsonc | head -1 || true)
          fi
          if [ -z "${OLD_KEY:-}" ]; then
            echo "::error::no key to replace — portal/wrangler.jsonc holds none and none was given"
            exit 1
          fi

          # A secret for the ops route, for this run only.
          OPS_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          printf '%s' "$OPS_SECRET" | npx wrangler secret put PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG"

          # The old key's own record. A replacement that does not carry the old key's customer,
          # origin allowlist and daily cap is not the same key with a new value — it is a different
          # key that happens to sit in the same place, and it is served to nobody if the allowlist
          # was left behind. So the parameters are read, not transcribed.
          # `wrangler secret put` deploys a new version carrying the secret, and the edge takes a
          # moment to serve it. Until it does, the route is the closed route it was before — so the
          # request is retried until the new version answers, rather than failing on a race.
          for attempt in $(seq 1 24); do
            curl -s -o old-key.json -w '%{http_code}' -X GET "$API_BASE/admin/projection/keys/$OLD_KEY" \
              -H "Authorization: Bearer $OPS_SECRET" > old-status.txt
            if [ "$(cat old-status.txt)" = "200" ]; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "::error::could not read the old key's record ($(cat old-status.txt))"
              cat old-key.json
              npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG" || true
              exit 1
            fi
            sleep 5
          done

          BODY=$(node -e '
            const m = process.argv[1].match(/\{[\s\S]*\}/);
            const body = m ? JSON.parse(m[0]) : null;
            const key = body?.key;
            if (!key) { process.stdout.write("{}"); process.exit(0); }
            process.stdout.write(JSON.stringify({
              kind: "browser",
              customerId: key.customerId,
              origins: key.origins ?? [],
              dailyLimit: key.dailyLimit ?? 1000,
              label: key.label ?? "demo browser",
              live: true
            }));
          ' "$(cat old-key.json)")

          if [ "$(node -e 'const b = JSON.parse(process.argv[1]); process.stdout.write(String(b.customerId ?? ""))' "$BODY")" = "" ]; then
            echo "::error::the old key's record has no customer"
            npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG" || true
            exit 1
          fi

          for attempt in $(seq 1 12); do
            curl -s -o minted.json -w '%{http_code}' -X POST "$API_BASE/admin/projection/keys" \
              -H "Authorization: Bearer $OPS_SECRET" \
              -H 'Content-Type: application/json' \
              --data "$BODY" > status.txt
            if [ "$(cat status.txt)" = "200" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::the projection route answered $(cat status.txt)"
              cat minted.json
              npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG" || true
              exit 1
            fi
            sleep 5
          done

          NEW_KEY=$(node -e '
            const m = process.argv[1].match(/\{[\s\S]*\}/);
            const body = m ? JSON.parse(m[0]) : null;
            process.stdout.write(body?.secret ?? "");
          ' "$(cat minted.json)")

          if [ -z "$NEW_KEY" ]; then
            echo "::error::the replacement key was not returned"
            npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG" || true
            exit 1
          fi

          # Into the secret store. `wrangler secret put` deploys the Worker immediately, so this is
          # what makes the new key live.
          printf '%s' "$NEW_KEY" | npx wrangler secret put DEMO_BROWSER_API_KEY -c "$WORKER_CONFIG"

          # The route closes again. The value is gone from the Worker's environment, so the route
          # is exactly as closed as it was before this run.
          npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG"

          # Which key is the Worker serving? A `vars` entry and a secret may share a name, and
          # which one wins is not something this workflow should assume — so it is measured.
          LIVE=$(curl -s --max-time 30 "$API_BASE/" | grep -oE 'pk_live_[a-f0-9]+' | head -1 || true)
          if [ "$LIVE" = "$NEW_KEY" ]; then
            echo "the Worker is serving the new key"
          elif [ "$LIVE" = "$OLD_KEY" ]; then
            echo "the Worker is still serving the old key — remove the vars entry and deploy"
          else
            echo "::warning::could not tell which key the Worker is serving"
          fi
          echo "the replacement is in the secret store; the vars entry is still to be removed"

          rm -f minted.json status.txt

      - name: Revoke a key
        if: inputs.action == 'revoke'
        env:
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::the revoke action needs the key id to disable"
            exit 1
          fi

          OPS_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          printf '%s' "$OPS_SECRET" | npx wrangler secret put PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG"

          for attempt in $(seq 1 24); do
            curl -s -o revoked.json -w '%{http_code}' -X DELETE "$API_BASE/admin/projection/keys/$KEY" \
              -H "Authorization: Bearer $OPS_SECRET" > status.txt
            if [ "$(cat status.txt)" = "200" ]; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "::error::the projection route answered $(cat status.txt)"
              cat revoked.json
              npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG" || true
              exit 1
            fi
            sleep 5
          done

          npx wrangler secret delete PROJECTION_ADMIN_SECRET -c "$WORKER_CONFIG"
          echo "the key is disabled; the value in git history no longer works"
          rm -f revoked.json status.txt

      # What can this credential actually do? The rotation needs three things and they are three
      # different Cloudflare permissions, so "the deploy job works" does not mean "the rotation
      # works". This says which of them are present, before anyone clicks mint and finds out.
      - name: Report what this credential can do
        if: inputs.action == 'check'
        run: |
          set -uo pipefail

          echo "--- what the rotation needs ---"

          if npx wrangler secret list -c "$WORKER_CONFIG" > /dev/null 2>&1; then
            echo "  ✓ Worker secrets: read and write"
          else
            echo "  ✗ Worker secrets: the secret store is not reachable with this credential"
          fi

          if npx wrangler kv namespace list > /dev/null 2>&1; then
            echo "  ✓ Workers KV: list (the token has it, so the key store is directly reachable)"
          else
            echo "  · Workers KV: no permission — so the rotation goes through the Worker's own"
            echo "    /admin/projection/* route, which holds the API_KEYS binding and needs no token"
          fi

          if npx wrangler d1 execute PORTAL_DB --remote -c "$PORTAL_CONFIG" --command "SELECT 1" > /dev/null 2>&1; then
            echo "  ✓ D1: read — the portal's api_key_mirror is readable, so the key's own"
            echo "    customer, origins and label are available"
          else
            echo "  ✗ D1: read — the key's parameters cannot be read"
          fi

          echo "--- and this one, for the record ---"
          if npx wrangler d1 execute PORTAL_DB --remote -c "$PORTAL_CONFIG" --command "SELECT 1" > /dev/null 2>&1; then
            echo "  ✓ D1: read"
          fi

          # The secret store is the half of the rotation this credential can do, and the half with
          # the most ways to be subtly wrong: the write has to be piped, and it deploys the Worker
          # as it goes. So it is proved — with a name nothing reads, written and deleted again.
          echo "--- proving the secret write, end to end ---"
          SELFTEST="rotation-selftest-$(date +%s)"
          if printf '%s' "proof" | npx wrangler secret put "$SELFTEST" -c "$WORKER_CONFIG" > /dev/null 2>&1; then
            echo "  ✓ Worker secrets: write (and the deploy it makes)"
            if npx wrangler secret delete "$SELFTEST" -c "$WORKER_CONFIG" > /dev/null 2>&1; then
              echo "  ✓ Worker secrets: delete"
            else
              echo "  ✗ Worker secrets: delete — remove $SELFTEST by hand"
            fi
          else
            echo "  ✗ Worker secrets: write"
          fi
