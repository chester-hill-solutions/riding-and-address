# Rotate the demo browser key.
#
# **Why this exists.** `portal/wrangler.jsonc` carried `DEMO_BROWSER_API_KEY` as a plain `vars`
# value, so a live production-bound credential was committed to the repository — and, being in
# history, could never be removed from it.
#
# The credential is a browser key: public by design, origin-allowlisted and daily-capped. The
# problem was never disclosure. It was that the file became an append-only log of live credentials,
# and that every future rotation wrote the next one into the tree as well. Moving the value into
# the Cloudflare secret store means the repository carries only the *name* of the secret, and a
# rotation leaves no trace in the tree at all.
#
# The procedure is written down in `docs/ops/demo-browser-key-rotation.md`. This workflow is the
# same procedure, using the credential the deploy job already holds, so it does not need a human's
# local machine and a wrangler login.
#
# **Two actions, because the order matters.**
#
# - `mint` — mint a replacement carrying the old key's own customer, origins, cap and label, put
#   it in the secret store, and report whether the Worker is now serving it. Does not revoke.
# - `revoke` — disable a key by id. Run this **after** the `vars` entry has been removed and
#   deployed, or the try-it widget loses the key it is serving.
#
# The new key is never printed. It lives in the secret store and on the page the browser reads it
# from, which is where a public browser key belongs.
name: Rotate the demo browser key

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'mint — create a replacement and put it in the secret store. revoke — disable a key. check — report what this credential can do.'
        required: true
        type: choice
        options:
          - mint
          - revoke
          - check
        default: mint
      key:
        description: 'For `revoke`: the key id to disable, e.g. pk_live_…'
        required: false

permissions:
  contents: read

concurrency:
  group: rotate-demo-browser-key
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ad5ec479b9a421faa2ed06c3d1c2b23a
      # The deployable config is generated by the portal's build; `scripts/write-deploy-redirect.mjs`
      # points wrangler at it. The secret must go on the same Worker the deploy job ships.
      WORKER_CONFIG: portal/build/server/wrangler.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the deployable config
        run: bun run build

      - name: Revoke a key
        if: inputs.action == 'revoke'
        env:
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::the revoke action needs the key id to disable"
            exit 1
          fi
          npx tsx scripts/manage-keys.ts revoke "$KEY" --remote

      # What can this credential actually do? The rotation needs three things and they are three
      # different Cloudflare permissions, so "the deploy job works" does not mean "the rotation
      # works". This says which of them are present, before anyone clicks mint and finds out.
      - name: Report what this credential can do
        if: inputs.action == 'check'
        run: |
          set -uo pipefail

          report() {
            if "$@" > /dev/null 2>&1; then
              echo "  ✓ $1"
            else
              echo "  ✗ $1"
            fi
          }

          echo "--- the rotation needs all three of these ---"

          if npx wrangler secret list -c "$WORKER_CONFIG" > /dev/null 2>&1; then
            echo "  ✓ Worker secrets: read and write"
            echo "    $(npx wrangler secret list -c "$WORKER_CONFIG" 2>/dev/null | tr -s ' ')"
          else
            echo "  ✗ Worker secrets: the secret store is not reachable with this credential"
          fi

          if npx wrangler kv namespace list > /dev/null 2>&1; then
            echo "  ✓ Workers KV: list"
          else
            echo "  ✗ Workers KV: list — the credential has no KV permission"
          fi

          if npx wrangler kv key list --binding API_KEYS --remote -c portal/wrangler.jsonc > /dev/null 2>&1; then
            echo "  ✓ Workers KV: read the API_KEYS namespace"
          else
            echo "  ✗ Workers KV: read the API_KEYS namespace — the credential has no KV permission"
          fi

          echo "--- and this one, for the record ---"
          if npx wrangler d1 execute PORTAL_DB --remote -c portal/wrangler.jsonc --command "SELECT 1" > /dev/null 2>&1; then
            echo "  ✓ D1: read"
          else
            echo "  ✗ D1: read"
          fi

          # The secret store is the half of the rotation this credential can do, and the half with
          # the most ways to be subtly wrong: the write has to be piped, and it deploys the Worker
          # as it goes. So it is proved — with a name nothing reads, written and deleted again.
          echo "--- proving the secret write, end to end ---"
          SELFTEST="rotation-selftest-$(date +%s)"
          if printf '%s' "proof" | npx wrangler secret put "$SELFTEST" -c "$WORKER_CONFIG" > /dev/null 2>&1; then
            echo "  ✓ Worker secrets: write (and the deploy it makes)"
            if npx wrangler secret delete "$SELFTEST" -c "$WORKER_CONFIG" > /dev/null 2>&1; then
              echo "  ✓ Worker secrets: delete"
            else
              echo "  ✗ Worker secrets: delete — remove $SELFTEST by hand"
            fi
          else
            echo "  ✗ Worker secrets: write"
          fi

      - name: Mint a replacement
        if: inputs.action == 'mint'
        run: |
          set -euo pipefail

          # Pre-flight. The key store needs a Cloudflare permission the deploy job's credential does
          # not have, and the failure otherwise arrives as a 401 in the middle of the run — after the
          # workflow has already looked like it was working.
          if ! npx wrangler kv key list --binding API_KEYS --remote -c portal/wrangler.jsonc > /dev/null 2>&1; then
            echo "::error::this credential cannot read the API_KEYS namespace, so it cannot mint or revoke a key."
            echo "::error::the token needs 'Workers KV Storage: Edit' on the account. Run the check action to see the whole picture."
            exit 1
          fi

          # The key currently in the config is the one being replaced.
          OLD_KEY=$(grep -oE 'pk_live_[a-f0-9]+' portal/wrangler.jsonc | head -1 || true)
          if [ -z "${OLD_KEY:-}" ]; then
            echo "::error::no demo browser key in portal/wrangler.jsonc — nothing to replace"
            exit 1
          fi

          # The replacement carries the old key's own parameters. Transcribing them by hand is how
          # an origin allowlist gets dropped, and a browser key with the wrong origins serves nobody.
          npx tsx scripts/manage-keys.ts show "$OLD_KEY" --remote > old-key.json
          CUSTOMER=$(node -e "process.stdout.write(String(require('./old-key.json').customerId || ''))")
          ORIGINS=$(node -e "process.stdout.write((require('./old-key.json').origins || []).join(','))")
          DAILY=$(node -e "process.stdout.write(String(require('./old-key.json').dailyLimit || 100000))")
          LABEL=$(node -e "process.stdout.write(String(require('./old-key.json').label || 'demo browser'))")
          if [ -z "$CUSTOMER" ] || [ -z "$ORIGINS" ]; then
            echo "::error::the old key record has no customer or origins"
            exit 1
          fi

          npx tsx scripts/manage-keys.ts create-browser \
            --customer "$CUSTOMER" --origins "$ORIGINS" --daily "$DAILY" --label "$LABEL" --remote \
            > mint.log 2>&1
          NEW_KEY=$(grep -oE 'pk_live_[a-f0-9]+' mint.log | head -1 || true)
          if [ -z "${NEW_KEY:-}" ]; then
            echo "::error::the replacement key was not minted"
            cat mint.log
            exit 1
          fi

          # Into the secret store. `wrangler secret put` deploys the Worker immediately, so this is
          # what makes the new key live.
          printf '%s' "$NEW_KEY" | npx wrangler secret put DEMO_BROWSER_API_KEY -c "$WORKER_CONFIG"

          echo "--- the secret store now holds ---"
          npx wrangler secret list -c "$WORKER_CONFIG"

          # Which key is the Worker serving? A `vars` entry and a secret may share a name, and
          # which one wins is not something this workflow should assume — so it is measured.
          LIVE=$(curl -s --max-time 30 https://cancoder.chesterhillsolutions.ca/ \
            | grep -oE 'pk_live_[a-f0-9]+' | head -1 || true)
          if [ "$LIVE" = "$NEW_KEY" ]; then
            echo "the Worker is serving the new key"
          elif [ "$LIVE" = "$OLD_KEY" ]; then
            echo "the Worker is still serving the old key — the vars entry wins, so remove it and deploy"
          else
            echo "::warning::could not tell which key the Worker is serving"
          fi

          rm -f old-key.json mint.log
