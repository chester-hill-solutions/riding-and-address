name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The ODA test harness runs the real D1 SQL against node:sqlite, which is
      # reliable from Node 24. Pin the same major as .nvmrc before bun install.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Check billing invariants
        run: bun run check:billing-invariants

      - name: Check for committed credentials
        run: bun run check:secrets

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Run tests and the coverage ratchet
        # The ratchet runs the suite with coverage, so this replaces a plain `bun run test` rather
        # than duplicating it: the gate fails on a coverage regression, which a plain test run
        # cannot see.
        run: bun run check:coverage

  portal:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Root deps are needed too: the combined Worker entry (portal/workers/app.ts)
      # imports ../../src/worker, whose sources resolve zod and
      # @cloudflare/workers-types from the repo root node_modules.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install portal dependencies
        working-directory: portal
        run: bun install --frozen-lockfile

      - name: Audit portal dependencies
        working-directory: portal
        run: bun audit --audit-level=high

      - name: Portal typecheck
        working-directory: portal
        run: bun run typecheck

      # The portal's own unit tests. The runtime smoke below exercises the built Worker; these
      # are the ones that can say what a single value is — the Stripe wire version, the price a
      # customer is shown, the bucket an address is counted under.
      - name: Portal unit tests
        working-directory: portal
        run: bun run test

      - name: Portal coverage ratchet
        # The portal's own gate, in the portal's own job: the portal installs its own dependencies,
        # and the root's job does not have them.
        working-directory: portal
        run: bun run check:coverage

      - name: Portal build + Worker dry-run
        working-directory: portal
        env:
          NODE_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ad5ec479b9a421faa2ed06c3d1c2b23a
        run: bun run build && bunx wrangler deploy --dry-run --env=""

      - name: Portal runtime smoke (local Worker)
        timeout-minutes: 2
        working-directory: portal
        run: bun run test:runtime

  # Production deploy, from the repository rather than from the dashboard's Workers Build.
  #
  # Why here: the dashboard's build/deploy commands are configuration that lives nowhere in the
  # repository, cannot be reviewed in a diff, and — as of #197 — do not apply migrations. That is
  # how an authorization server reached production with no tables behind it: the metadata endpoint
  # answered 200 (Better Auth validates the drizzle schema OBJECT, not the database) while every
  # authorization returned 500. Nothing in the repo connected the two.
  #
  # Here the migration and the code that needs it ship in one reviewed step, and the migration runs
  # FIRST: a deploy that cannot migrate must not put code in front of a schema it does not have.
  #
  # The deploy itself matches what the dashboard did — `bun run build` at the root writes
  # .wrangler/deploy/config.json pointing at the portal build output, and wrangler finds it from
  # there. Changing this must not change that, or the deploy silently targets nothing.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, portal]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install portal dependencies
        working-directory: portal
        run: bun install --frozen-lockfile

      - name: Apply D1 migrations
        working-directory: portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5ec479b9a421faa2ed06c3d1c2b23a
        run: bunx wrangler d1 migrations apply PORTAL_DB --remote

      - name: Build
        run: bun run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5ec479b9a421faa2ed06c3d1c2b23a
        run: npx wrangler deploy
