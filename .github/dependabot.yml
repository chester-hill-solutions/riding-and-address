version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    # TypeScript 7 cannot be linted yet: `typescript-eslint`'s peer range is `>=4.8.4 <6.1.0`,
    # and no release — stable or prerelease — widens it. A grouped bump that carries it fails
    # the whole run, and so does a solo one, so the exclusion is at the top level rather than
    # on the group. Remove this when the linter supports TypeScript 7.
    ignore:
      - dependency-name: "typescript"
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
  - package-ecosystem: bun
    directory: "/portal"
    schedule:
      interval: weekly
    # The same ceiling as the root, for the same reason: the two packages share a
    # toolchain, and a version of the compiler that one of them cannot lint is a version
    # nobody should be on. The portal's own `tsc -b` may well be happy with it — the point
    # is that the pair moves together, not that either is broken.
    ignore:
      - dependency-name: "typescript"
    groups:
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "vite"
          - "@cloudflare/vite-plugin"
          - "typescript"
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
