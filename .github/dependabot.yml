version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: "/portal"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "vite"
          - "@cloudflare/vite-plugin"
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
